name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.TAG} must match package version v${version}`);
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build and package
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          zip -r "release-assets/jquery-sked-tape-${TAG}-dist.zip" dist LICENSE README.md MIGRATION.md CHANGELOG
          cd release-assets
          sha256sum *.zip *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Release already published; assets will not be overwritten")'
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "$TAG" --draft
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
